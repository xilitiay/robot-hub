<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="查看机器人详细参数：负载、臂展、自由度、重量、年份、价格与自主度。RobotHub 全球机器人产品库。">
<title>Robot Detail — RobotHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>

<div class="container detail">
  <div class="print-head" id="printHead" aria-hidden="true">
    <div class="ph-brand">🤖 RobotHub</div>
    <div class="ph-title" id="phTitle"></div>
    <div class="ph-meta" id="phMeta"></div>
  </div>
  <div id="root"></div>
    <div class="print-foot" id="printFoot" aria-hidden="true"></div>
    <div class="batch-bar" id="relBatchBar" style="display:none">
      <span class="bcount"><span data-i="batch_sel_prefix"></span><b id="relBatchCount">0</b><span data-i="batch_sel_suffix"></span></span>
      <button class="btn btn-primary btn-sm" type="button" onclick="relAddCmp()" data-i="compare"></button>
      <button class="btn btn-ghost btn-sm" type="button" onclick="relFavAll()" data-i="fav"></button>
      <input id="relBatchTag" class="modal-input btag" maxlength="24" data-ph="batch_tag" onkeydown="if(event.key==='Enter')relApplyTag()">
      <button class="btn btn-ghost btn-sm" type="button" onclick="relApplyTag()" data-i="batch_apply"></button>
      <button class="btn btn-ghost btn-sm" type="button" onclick="selectRelAll()" data-i="batch_all"></button>
      <button class="btn btn-ghost btn-sm" type="button" onclick="clearRelSel()" data-i="batch_clear"></button>
    </div>
  </div>

<!-- RFQ modal -->
<div class="modal-mask" id="rfqMask">
  <div class="modal">
    <h3 data-i="rfq_title"></h3>
    <p class="mdesc" data-i="rfq_sub"></p>
    <form onsubmit="event.preventDefault();submitRfq()">
      <div class="field"><label data-i="rfq_name"></label><input id="f_name" required></div>
      <div class="field"><label data-i="rfq_company"></label><input id="f_company"></div>
      <div class="field"><label data-i="rfq_email"></label><input id="f_email" type="email" required></div>
      <div class="field"><label data-i="rfq_phone"></label><input id="f_phone"></div>
      <div class="field"><label data-i="rfq_msg"></label><textarea id="f_msg" rows="3"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeRfq()" data-i="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i="submit"></button>
      </div>
    </form>
  </div>
</div>

<script>
const id=new URLSearchParams(location.search).get('id');
let ROBOT=null;
function spec(label,val){ return val!=null&&val!==''?`<tr><td>${label}</td><td>${val}</td></tr>`:''; }
function specBars(r){
  const defs=[
    {l:t('spec_payload'),v:r.payload,max:500,u:'kg'},
    {l:t('spec_reach'),v:r.reach,max:3500,u:'mm'},
    {l:t('spec_dof'),v:r.dof,max:7,u:''},
    {l:t('spec_weight'),v:r.weight,max:2000,u:'kg'},
    {l:t('spec_year'),v:r.year,max:2026,u:''},
  ].filter(d=>d.v!=null&&!isNaN(d.v));
  if(!defs.length) return '';
  return `<div class="spec-bars"><h4>${t('spec_quickview')}</h4>${defs.map(d=>{const p=Math.max(5,Math.min(100,Math.round(d.v/d.max*100)));return `<div class="sbar"><div class="lbl"><span>${d.l}</span><b>${d.v}${d.u}</b></div><div class="track"><div class="fill" data-w="${p}"></div></div></div>`;}).join('')}</div>`;
}

async function render(){
  const d=await api('/api/robots/'+id);
  if(d.error){ document.getElementById('root').innerHTML='<div class="empty"><div class="e">🤖</div><h3 data-i="empty_title"></h3></div>'; applyI18n(); return; }
  ROBOT=d.robot; const r=d.robot; REL_IDS=(d.related||[]).map(x=>x.id);
  const cat=META.categories.find(c=>c.id===r.category), auto=META.autonomyLevels.find(a=>a.id===r.autonomy);
  const cc=r.countryInfo;
  document.title=`${r.brand} ${r.model} — RobotHub`;
  pushRecent(r.id);
  document.getElementById('root').innerHTML=`
    <div class="breadcrumb"><a href="/">RobotHub</a> / <a href="/catalog.html?category=${r.category}">${LANG==='zh'?cat.zh:cat.en}</a> / ${r.model}</div>
    <div class="detail-top cat-${r.category}">
      <div class="detail-media"><div class="grid-deco"></div><span class="wm">${brandInitials(r.brand)}</span><span class="emoji">${EMOJI[r.category]}</span>${r.featured?`<span class="feat" style="top:16px;left:16px">★ ${LANG==='zh'?'精选':'FEATURED'}</span>`:''}</div>
      <div class="detail-info">
        <div class="tags"><span class="tag cat">${LANG==='zh'?cat.zh:cat.en}</span><span class="tag auto">${LANG==='zh'?auto.zh:auto.en}</span></div>
        <div class="sub">${LANG==='zh'?(r.brandZh||r.brand):r.brand} ${cc?('· '+cc.flag+' '+(LANG==='zh'?cc.zh:cc.en)):''}</div>
        <h1>${r.model}</h1>
        <p class="desc">${LANG==='zh'?r.descZh:r.descEn}</p>
        <table class="spec-table">
          ${spec(t('spec_brand'),LANG==='zh'?(r.brandZh||r.brand):r.brand)}
          ${spec(t('spec_category'),LANG==='zh'?cat.zh:cat.en)}
          ${spec(t('spec_autonomy'),LANG==='zh'?auto.zh:auto.en)}
          ${spec(t('spec_payload'),r.payload!=null?r.payload+' kg':'')}
          ${spec(t('spec_reach'),r.reach!=null?r.reach+' mm':'')}
          ${spec(t('spec_dof'),r.dof)}
          ${spec(t('spec_weight'),r.weight!=null?r.weight+' kg':'')}
          ${spec(t('spec_year'),r.year)}
          ${spec(t('spec_country'),cc?(cc.flag+' '+(LANG==='zh'?cc.zh:cc.en)):'')}
          ${spec(t('spec_price'),r.priceText)}
        </table>
        ${specBars(r)}
        ${r.apps&&r.apps.length?`<div class="app-chips">${r.apps.map(a=>`<span class="app-chip">${a}</span>`).join('')}</div>`:''}
        <div class="detail-actions">
          <button class="btn btn-primary" onclick="openRfq()" data-i="request_quote"></button>
          <button class="btn btn-ghost fav-act ${getFavs().includes(r.id)?'on':''}" id="favBtn" data-id="${r.id}" onclick="toggleFav('${r.id}');syncFav('${r.id}')">${getFavs().includes(r.id)?'★ '+t('fav_on'):'☆ '+t('fav')}</button>
          <button class="btn btn-ghost" onclick="toggleCmp('${r.id}')" data-i="compare"></button>
          <button class="btn btn-ghost" onclick="printRobot()" data-i="cmp_print"></button>
          <a class="btn btn-ghost" href="/catalog.html?category=${r.category}" data-i="back"></a>
        </div>
      </div>
    </div>
    <div class="section detail-related" style="padding:44px 0 0">
      <div class="section-head"><h2 data-i="related"></h2>${d.related.length?`<button class="btn btn-ghost btn-sm" id="relSelToggle" type="button" onclick="toggleRelSelect()" data-i="sel"></button>`:''}</div>
      <div class="robot-grid" id="relGrid">${d.related.map(robotCard).join('')}</div>
    </div>`;
  applyI18n();
  syncRelSelUI(); markRelSelected();
  setTimeout(()=>document.querySelectorAll('.spec-bars .fill').forEach(f=>f.style.width=f.dataset.w+'%'),80);
}
function openRfq(){ document.getElementById('rfqMask').classList.add('show'); }
function closeRfq(){ document.getElementById('rfqMask').classList.remove('show'); }
function printRobot(){
  if(!ROBOT) return;
  const d=new Date(); const pad=n=>String(n).padStart(2,'0');
  const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const cat=META.categories.find(c=>c.id===ROBOT.category);
  const phTitle=document.getElementById('phTitle');
  if(phTitle) phTitle.textContent=`${ROBOT.brand} ${ROBOT.model} · ${(LANG==='zh'?cat.zh:cat.en)} ${LANG==='zh'?'规格书':'Spec Sheet'}`;
  const phMeta=document.getElementById('phMeta');
  if(phMeta) phMeta.textContent=(LANG==='zh'?'生成时间':'Generated')+': '+ds;
  const foot=document.getElementById('printFoot');
  if(foot) foot.textContent=(LANG==='zh'?'由 RobotHub 生成 · 全球机器人产品库 · ':'Generated by RobotHub · Global Robot Catalog · ')+'https://robotiay.com';
  // 确保规格条宽度已落地再打印
  document.querySelectorAll('.spec-bars .fill').forEach(f=>{ f.style.width=(f.dataset.w||'0')+'%'; });
  const before=document.title;
  document.title='RobotHub-'+ROBOT.brand+'-'+ROBOT.model;
  window.focus(); window.print();
  setTimeout(()=>{ document.title=before; },400);
}
async function submitRfq(){
  const body={ robotId:id, name:val('f_name'), company:val('f_company'), email:val('f_email'), phone:val('f_phone'), message:val('f_msg') };
  const res=await api('/api/rfq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.ok){ closeRfq(); toast(t('rfq_ok'),'ok'); ['f_name','f_company','f_email','f_phone','f_msg'].forEach(i=>document.getElementById(i).value=''); }
}
const val=(i)=>document.getElementById(i).value;
/* ---- 相关推荐 多选 + 批量操作 ---- */
let REL_SEL_MODE=false;
let REL_IDS=[];
const REL_SEL=new Set();
function syncRelSelUI(){
  const btn=document.getElementById('relSelToggle');
  if(btn){ btn.classList.toggle('on',REL_SEL_MODE); btn.textContent = REL_SEL_MODE ? t('sel_done') : t('sel'); }
  document.body.classList.toggle('selecting',REL_SEL_MODE);
  updateRelBatchBar();
}
function toggleRelSelect(){
  REL_SEL_MODE=!REL_SEL_MODE;
  if(REL_SEL_MODE){
    // 进入选择模式时，从跨页选择篮播种：保留收藏页等其它页面所选项
    const g=getSel();
    REL_SEL.clear();
    REL_IDS.forEach(id=>{ if(g.has(id)) REL_SEL.add(id); });
  } else {
    clearRelSel();
  }
  syncRelSelUI(); markRelSelected();
}
function onRelGridClick(e){
  if(!REL_SEL_MODE) return;
  if(e.target.closest('button')||e.target.closest('a')||e.target.closest('input')) return;
  const card=e.target.closest('#relGrid .rcard'); if(!card) return;
  const id=card.dataset.id; if(!id) return;
  if(REL_SEL.has(id)){ REL_SEL.delete(id); removeSelStore(id); }
  else { REL_SEL.add(id); addSelStore(id); }
  card.classList.toggle('sel',REL_SEL.has(id));
  updateRelBatchBar();
}
function selectRelAll(){ document.querySelectorAll('#relGrid .rcard').forEach(c=>{ const id=c.dataset.id; if(id){ REL_SEL.add(id); addSelStore(id); c.classList.add('sel'); } }); updateRelBatchBar(); }
function clearRelSel(){
  // 仅移除当前可见的选中项，保留其他页面（如收藏页）的选择
  document.querySelectorAll('#relGrid .rcard.sel').forEach(c=>{ const id=c.dataset.id; if(id){ REL_SEL.delete(id); removeSelStore(id); } c.classList.remove('sel'); });
  updateRelBatchBar();
}
function markRelSelected(){ document.querySelectorAll('#relGrid .rcard').forEach(c=>{ if(REL_SEL.has(c.dataset.id)) c.classList.add('sel'); }); }
function updateRelBatchBar(){
  const bar=document.getElementById('relBatchBar');
  if(bar) bar.style.display=(REL_SEL_MODE && REL_SEL.size>0)?'flex':'none';
  const cnt=document.getElementById('relBatchCount'); if(cnt) cnt.textContent=REL_SEL.size;
}
function relAddCmp(){ if(!REL_SEL.size) return; addAllToCmp([...REL_SEL]); clearRelSel(); }
function relFavAll(){
  if(!REL_SEL.size) return;
  const a=getFavs(); let added=0; REL_SEL.forEach(id=>{ if(!a.includes(id)){ a.push(id); added++; } });
  setFavs(a); REL_SEL.forEach(id=>syncFav(id)); clearRelSel();
  toast(added?(LANG==='zh'?`已收藏 ${added} 款`:`Saved ${added} items`):(LANG==='zh'?'已在收藏中':'Already saved'),'ok');
}
function relApplyTag(){
  const tag=document.getElementById('relBatchTag').value.trim(); if(!tag) return;
  let n=0; REL_SEL.forEach(id=>{ addFavTag(id,tag); n++; });
  document.getElementById('relBatchTag').value=''; clearRelSel();
  toast(LANG==='zh'?`已给 ${n} 款打上「${tag}」`:`Tagged ${n} items with "${tag}"`,'ok');
}
async function init(){
  renderChrome('catalog'); await loadMeta(); applyI18n(); renderTray();
  document.getElementById('root').addEventListener('click', onRelGridClick);
  document.addEventListener('favchange',()=>{ REL_SEL.forEach(id=>syncFav(id)); });
  document.addEventListener('langchange',render);
  render();
}
init();
</script>
</body>
</html>
