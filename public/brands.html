<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="全球领先机器人制造商一览，按字母或国家浏览品牌、型号数量与产地。RobotHub。">
<title>Brands · 品牌 — RobotHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>

<div class="container" style="padding-top:32px">
  <div class="section-head"><div>
    <h2 data-i="brands_title"></h2>
    <p data-i="brands_sub"></p>
  </div>
    <div class="brand-tools">
      <div class="seg" id="bgroupSeg" role="tablist" aria-label="group by">
        <button type="button" data-v="letter" class="on" onclick="setGroup('letter')" data-i="group_letter"></button>
        <button type="button" data-v="country" onclick="setGroup('country')" data-i="group_country"></button>
      </div>
      <select id="bsort" class="sort-sel" onchange="setSort(this.value)">
        <option value="name" data-i="sort_name"></option>
        <option value="count" data-i="sort_models"></option>
        <option value="country" data-i="sort_country"></option>
      </select>
      <input id="bs" class="hero-search" style="padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px" data-ph="nav_brands" oninput="filterBrands(this.value)">
    </div>
  </div>
  <div class="az-index hide" id="azIndex"></div>
  <div id="grid"></div>
  <div class="empty hide" id="empty"><div class="e">🔍</div><h3 data-i="empty_title"></h3><p data-i="empty_sub"></p></div>
</div>

<script>
let ALL=[];
let CMAP={};          // country code → {en,zh,flag,continent} from META
let CONT={};          // continent code → {en,zh,flag,order} from META (+ 'other' fallback)
let azObserver=null;
let bgroup=localStorage.getItem('rh_group')||'letter';
let bsort=localStorage.getItem('rh_sort')||'name';
function setGroup(v){ bgroup=v; localStorage.setItem('rh_group',v); document.querySelectorAll('#bgroupSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); renderBrands(); }
function setSort(v){ bsort=v; localStorage.setItem('rh_sort',v); renderBrands(); }
// brand name → first letter bucket (A-Z or # for digits/symbols)
function firstLetter(b){
  const n=(b.brand||'').trim();
  if(!n) return '#';
  const c=n[0].toUpperCase();
  return /[A-Z]/.test(c)?c:'#';
}
// deterministic hue from brand string → stable, distinct logo colors
function brandHue(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
// trademark-safe logo placeholder: colored monogram tile, NOT the actual brand mark
function brandCard(b){
  const name=LANG==='zh'?(b.brandZh||b.brand):b.brand;
  const sub=LANG==='zh'?b.brand:(b.brandZh||'');
  const flag=b.countryInfo?b.countryInfo.flag:'';
  const countryName=b.countryInfo?(LANG==='zh'?b.countryInfo.zh:b.countryInfo.en):'';
  const cats=(b.cats||[]).map(id=>{const c=(META.categories||[]).find(x=>x.id===id);return c?(LANG==='zh'?c.zh:c.en):id;});
  const ini=brandInitials(b.brand);
  const hue=brandHue(b.brand);
  return `<a class="brand-card" href="/catalog.html?brand=${encodeURIComponent(b.brand)}">
    <div class="bhead">
      <span class="blogo" style="--h:${hue}" aria-hidden="true">${ini}</span>
      <div class="btxt">
        <h3>${name}</h3>
        ${sub?`<div class="zh">${sub}</div>`:''}
      </div>
      <span class="badge">${b.c} <span data-i="models">${t('models')}</span></span>
    </div>
    <div class="meta"><span>${flag} ${countryName}</span><span>${cats.slice(0,2).join(' · ')}${cats.length>2?' +'+(cats.length-2):''}</span></div>
  </a>`;
}
function goGroup(K){
  const el=document.getElementById('sec-'+K);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function highlightActive(K){
  document.querySelectorAll('#azIndex .az').forEach(b=>b.classList.toggle('active', b.dataset.key===K));
}
// scroll-spy: highlight the group (letter or country) currently in view
function setupScrollSpy(){
  if(azObserver) azObserver.disconnect();
  azObserver=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ highlightActive(e.target.dataset.key); } });
  },{rootMargin:'-90px 0px -62% 0px', threshold:0});
  document.querySelectorAll('.brand-section').forEach(s=>azObserver.observe(s));
}
function sortBrands(arr,mode){
  const a=arr.slice();
  if(mode==='count') a.sort((x,y)=>(y.c||0)-(x.c||0) || x.brand.localeCompare(y.brand));
  else if(mode==='country') a.sort((x,y)=>(x.country||'').localeCompare(y.country||'') || x.brand.localeCompare(y.brand));
  else a.sort((x,y)=>x.brand.localeCompare(y.brand));
  return a;
}
function renderBrands(){
  const grid=document.getElementById('grid'), emp=document.getElementById('empty'), az=document.getElementById('azIndex');
  const v=(document.getElementById('bs').value||'').trim().toLowerCase();
  const mode=bsort;
  const group=bgroup;
  const list=ALL.filter(b=>(b.brand+' '+(b.brandZh||'')+' '+b.country).toLowerCase().includes(v));
  if(azObserver){ azObserver.disconnect(); azObserver=null; }
  document.querySelectorAll('#azIndex .az').forEach(b=>b.classList.remove('active'));
  emp.classList.toggle('hide',list.length>0);
  grid.classList.toggle('hide',list.length===0);
  if(!list.length){ az.classList.add('hide'); grid.innerHTML=''; return; }

  if(group==='country'){
    // 三级导航：大洲 → 国家/地区 → 品牌
    az.classList.remove('hide');
    const byCont={};
    list.forEach(b=>{
      const cont=(CMAP[b.country]&&CMAP[b.country].continent)||'other';
      (byCont[cont]=byCont[cont]||[]).push(b);
    });
    // 大洲按 meta.order 排序，同序再按品牌数降序
    const contKeys=Object.keys(byCont).sort((a,b)=>{
      const oa=(CONT[a]&&CONT[a].order)||99, ob=(CONT[b]&&CONT[b].order)||99;
      if(oa!==ob) return oa-ob;
      return byCont[b].length-byCont[a].length;
    });
    grid.innerHTML=contKeys.map(cont=>{
      const cinfo=CONT[cont]||{flag:'🌐',zh:'其他',en:'Other'};
      const cname=LANG==='zh'?cinfo.zh:cinfo.en;
      const brands=byCont[cont];
      const cg={};
      brands.forEach(b=>{ const K=b.country||'??'; (cg[K]=cg[K]||[]).push(b); });
      const ckeys=Object.keys(cg).sort((a,b)=>a.localeCompare(b));
      return `<section class="brand-section" id="sec-${cont}" data-key="${cont}">
        <h3 class="brand-section-title cont-title">${cinfo.flag} ${cname} <small>${brands.length}</small></h3>
        <div class="cont-body">${ckeys.map(K=>{
          const info=CMAP[K]||{}, name=LANG==='zh'?info.zh:info.en;
          return `<section class="brand-sub" id="sec-${K}" data-key="${K}">
            <h4 class="brand-sub-title">${info.flag||''} ${K} <small>${name||K} · ${cg[K].length}</small></h4>
            <div class="brand-grid">${sortBrands(cg[K],mode).map(brandCard).join('')}</div>
          </section>`;
        }).join('')}</div>
      </section>`;
    }).join('');
    az.innerHTML=contKeys.map(cont=>{
      const cinfo=CONT[cont]||{flag:'🌐',zh:'其他',en:'Other'};
      const cname=LANG==='zh'?cinfo.zh:cinfo.en;
      return `<button class="az on" data-key="${cont}" onclick="goGroup('${cont}')" title="${cname}">${cinfo.flag}${cname}<i>${byCont[cont].length}</i></button>`;
    }).join('');
    setupScrollSpy();
  } else {
    // 按字母 A–Z 分组
    az.classList.remove('hide');
    const groups={};
    list.forEach(b=>{ const L=firstLetter(b); (groups[L]=groups[L]||[]).push(b); });
    const letters=Object.keys(groups).sort();
    grid.innerHTML=letters.map(L=>`<section class="brand-section" id="sec-${L}" data-key="${L}">
      <h3 class="brand-section-title">${L} <small>${groups[L].length}</small></h3>
      <div class="brand-grid">${sortBrands(groups[L],mode).map(brandCard).join('')}</div>
    </section>`).join('');
    const all='ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
    az.innerHTML=all.map(L=>{
      const n=groups[L]?groups[L].length:0;
      return `<button class="az ${n?'on':''}" data-key="${L}" ${n?`onclick="goGroup('${L}')"`:'disabled'}>${L}<i>${n||''}</i></button>`;
    }).join('');
    setupScrollSpy();
  }
  applyI18n();
}
const _filterD = debounce(renderBrands, 180);
function filterBrands(){ _filterD(); }   // 防抖，避免每次击键都全量重渲染
async function init(){
  renderChrome('brands'); await loadMeta();
  CMAP=META.countries||{};
  CONT=Object.assign({other:{en:'Other',zh:'其他',flag:'🌐',order:99}}, META.continents||{});
  document.getElementById('bsort').value=bsort;
  document.querySelectorAll('#bgroupSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===bgroup));
  ALL=await api('/api/brands');
  if(!Array.isArray(ALL)) ALL=[];   // 接口异常时兜底为空，避免白屏
  renderBrands();
  applyI18n(); renderTray();
  document.addEventListener('langchange',renderBrands);
}
init();
</script>
</body>
</html>
