<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brands · 品牌 — RobotHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>

<div class="container" style="padding-top:32px">
  <div class="section-head"><div>
    <h2 data-i="brands_title"></h2>
    <p data-i="brands_sub"></p>
  </div>
    <div style="min-width:260px">
      <input id="bs" class="hero-search" style="padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;width:100%" data-ph="nav_brands" oninput="filterBrands(this.value)">
    </div>
  </div>
  <div class="az-index hide" id="azIndex"></div>
  <div id="grid"></div>
  <div class="empty hide" id="empty"><div class="e">🔍</div><h3 data-i="empty_title"></h3><p data-i="empty_sub"></p></div>
</div>

<script>
let ALL=[];
function firstLetter(b){
  const n=(b.brand||'').trim();
  if(!n) return '#';
  const c=n[0].toUpperCase();
  return /[A-Z]/.test(c)?c:'#';
}
function brandCard(b){
  const name=LANG==='zh'?(b.brandZh||b.brand):b.brand;
  const sub=LANG==='zh'?b.brand:(b.brandZh||'');
  const flag=b.countryInfo?b.countryInfo.flag:'';
  const countryName=b.countryInfo?(LANG==='zh'?b.countryInfo.zh:b.countryInfo.en):'';
  const cats=(b.cats||[]).map(id=>{const c=(META.categories||[]).find(x=>x.id===id);return c?(LANG==='zh'?c.zh:c.en):id;});
  return `<a class="brand-card" href="/catalog.html?brand=${encodeURIComponent(b.brand)}">
    <div class="bt"><h3>${name}</h3><span class="badge">${b.c} <span data-i="models">${t('models')}</span></span></div>
    ${sub?`<div class="zh">${sub}</div>`:''}
    <div class="meta"><span>${flag} ${countryName}</span><span>${cats.slice(0,2).join(' · ')}${cats.length>2?' +'+(cats.length-2):''}</span></div>
  </a>`;
}
function goLetter(L){
  const el=document.getElementById('sec-'+L);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderAz(activeLetters){
  const az=document.getElementById('azIndex');
  const all='ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  az.innerHTML=all.map(L=>`<button class="az ${activeLetters.includes(L)?'on':''}" ${activeLetters.includes(L)?`onclick="goLetter('${L}')"`:'disabled'}>${L}</button>`).join('');
}
function renderBrands(){
  const grid=document.getElementById('grid'), emp=document.getElementById('empty'), az=document.getElementById('azIndex');
  const v=(document.getElementById('bs').value||'').trim().toLowerCase();
  const list=ALL.filter(b=>(b.brand+' '+(b.brandZh||'')+' '+b.country).toLowerCase().includes(v));
  if(v){
    az.classList.add('hide');
    grid.innerHTML=list.map(brandCard).join('');
  } else {
    az.classList.remove('hide');
    const groups={};
    list.forEach(b=>{ const L=firstLetter(b); (groups[L]=groups[L]||[]).push(b); });
    const letters=Object.keys(groups).sort();
    grid.innerHTML=letters.map(L=>`<section class="brand-section" id="sec-${L}">
      <h3 class="brand-section-title">${L}</h3>
      <div class="brand-grid">${groups[L].map(brandCard).join('')}</div>
    </section>`).join('');
    renderAz(letters);
  }
  applyI18n();
  emp.classList.toggle('hide',list.length>0);
  grid.classList.toggle('hide',list.length===0);
}
function filterBrands(v){ renderBrands(); }
async function init(){
  renderChrome('brands'); await loadMeta();
  ALL=await api('/api/brands');
  renderBrands();
  applyI18n(); renderTray();
  document.addEventListener('langchange',renderBrands);
}
init();
</script>
</body>
</html>
