<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="我的收藏与最近浏览 — RobotHub 全球机器人产品库。">
<title>我的收藏 — RobotHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>

<div class="container">
  <section class="fav-hero">
    <h1 data-i="fav_title"></h1>
    <p data-i="fav_sub"></p>
  </section>

  <section id="recentSection" style="margin-top:8px">
    <div class="section-head">
      <h2 data-i="recent"></h2>
      <button class="btn btn-ghost btn-sm" id="recentAddCmp" onclick="addAllRecentToCmp()" data-i="add_all_cmp" style="display:none"></button>
    </div>
    <div class="robot-grid" id="recentGrid"></div>
  </section>

  <section style="margin-top:34px">
    <div class="section-head fav-head">
      <h2 data-i="fav_title"></h2>
      <div class="fav-actions">
        <button class="btn btn-ghost btn-sm" id="selToggle" onclick="toggleSelectMode()" data-i="sel" style="display:none"></button>
        <button class="btn btn-ghost btn-sm" id="favAddCmp" onclick="addAllFavsToCmp()" data-i="add_all_cmp" style="display:none"></button>
        <button class="btn btn-ghost btn-sm" id="clearFav" onclick="clearFavs()" data-i="clear_fav" style="display:none"></button>
      </div>
    </div>
    <div class="tag-bar" id="favTagBar" style="display:none"></div>
    <div class="tag-overview" id="tagOverview" style="display:none"></div>
    <div class="robot-grid" id="favGrid"></div>
    <div class="batch-bar" id="batchBar" style="display:none">
      <span class="bcount"><span data-i="batch_sel_prefix"></span><b id="batchCount">0</b><span data-i="batch_sel_suffix"></span></span>
      <input id="batchTag" class="modal-input btag" maxlength="24" data-ph="batch_tag" onkeydown="if(event.key==='Enter')applyTagToSelected()">
      <button class="btn btn-primary btn-sm" type="button" onclick="applyTagToSelected()" data-i="batch_apply"></button>
      <button class="btn btn-ghost btn-sm" type="button" onclick="selectAll()" data-i="batch_all"></button>
      <button class="btn btn-ghost btn-sm" type="button" onclick="clearSel()" data-i="batch_clear"></button>
    </div>
  </section>
</div>

<div class="modal-mask" id="tagModal" style="display:none" onclick="if(event.target===this)closeTagEditor()">
  <div class="modal tag-modal">
    <h3 data-i="tag_edit"></h3>
    <label class="modal-label" data-i="tag_new_name"></label>
    <input id="tagNameInput" class="modal-input" maxlength="24" autocomplete="off" oninput="checkTagConflict()">
    <div class="tag-conflict" id="tagConflict" style="display:none"></div>
    <div class="modal-label" data-i="tag_color"></div>
    <div class="swatches" id="tagSwatches"></div>
    <div class="modal-label" data-i="tag_merge"></div>
    <div class="modal-merge">
      <select id="mergeTarget" class="modal-input"></select>
      <button class="btn btn-ghost btn-sm" id="mergeBtn" type="button" onclick="mergeTagInto()" data-i="tag_merge_btn"></button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm btn-danger" type="button" onclick="deleteFavTagGlobal(currentEditTag);closeTagEditor();renderFav()" data-i="tag_delete"></button>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" type="button" onclick="closeTagEditor()" data-i="tag_cancel"></button>
      <button class="btn btn-primary btn-sm" type="button" id="tagSaveBtn" onclick="saveTagEdit()" data-i="tag_save"></button>
    </div>
  </div>
</div>

<div class="ctx-menu" id="tagCtxMenu" style="display:none"></div>

<script>
let FAV_TAG_FILTER='';
let currentEditTag='';
let currentEditColor='';   // '' = 全部
let FAV_ITEMS=[];
let TAG_SORT='count_desc';  // count_desc | count_asc | name

const escJs = s => String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function addAllFavsToCmp(){ addAllToCmp(getFavs()); }
function addAllRecentToCmp(){ addAllToCmp(getRecentIds()); }

function filterFavByTag(tag){ FAV_TAG_FILTER=tag; renderFav(); }

function decorateFavCards(grid, items){
  const cards=grid.querySelectorAll('.rcard');
  cards.forEach((card,i)=>{
    const r=items[i]; if(!r) return;
    const tags=(getFavTags()[r.id]||[]);
    const row=document.createElement('div');
    row.className='fav-tagrow';
    row.innerHTML = tags.map(tg=>`<span class="ftag" style="--ftag-c:${favTagColor(tg)}" onclick="removeFavTagFromCard('${r.id}','${escJs(tg)}')" title="${t('tag_edit')}">${escHtml(tg)} <b>×</b></span>`).join('')
      + `<input class="ftag-add" placeholder="${t('tag_add_hint')}" onkeydown="if(event.key==='Enter')addFavTagFromCard('${r.id}',this.value,this)">`;
    card.appendChild(row);
  });
}
function addFavTagFromCard(id,val,input){
  const tag=(val||'').trim(); if(!tag) return;
  addFavTag(id,tag);
  if(input) input.value='';
  rerenderFavSections();
}
function removeFavTagFromCard(id,tag){
  removeFavTag(id,tag);
  if(FAV_TAG_FILTER && !allFavTags().includes(FAV_TAG_FILTER)) FAV_TAG_FILTER='';
  rerenderFavSections();
}

/* ---- Tag editor (rename / recolor / delete) ---- */
function openTagEditor(tag){
  currentEditTag=tag; currentEditColor=favTagColor(tag);
  document.getElementById('tagNameInput').value=tag;
  renderTagSwatches();
  const sel=document.getElementById('mergeTarget');
  const others=allFavTags().filter(tg=>tg!==tag).sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = others.length ? others.map(tg=>`<option value="${escHtml(tg)}">${escHtml(tg)}</option>`).join('') : `<option value="" disabled>—</option>`;
  document.getElementById('mergeBtn').disabled = !others.length;
  document.getElementById('tagModal').style.display='flex';
  checkTagConflict();
  setTimeout(()=>document.getElementById('tagNameInput').focus(),0);
}
// 重命名时的实时冲突检测：若新名称已存在（即合并），给出提示并把保存按钮变为「合并」
function checkTagConflict(){
  const nv=document.getElementById('tagNameInput').value.trim();
  const old=currentEditTag;
  const el=document.getElementById('tagConflict');
  const saveBtn=document.getElementById('tagSaveBtn');
  if(nv && nv!==old && allFavTags().includes(nv)){
    el.style.display='block';
    el.textContent = LANG==='zh'
      ? `「${nv}」已存在，保存将把「${old}」合并进「${nv}」`
      : `"${nv}" already exists — saving will merge "${old}" into it`;
    if(saveBtn) saveBtn.textContent = LANG==='zh' ? t('tag_merge_btn') : 'Merge';
  } else {
    el.style.display='none'; el.textContent='';
    if(saveBtn) saveBtn.textContent = t('tag_save');
  }
}
function mergeTagInto(){
  const from=currentEditTag;
  const to=document.getElementById('mergeTarget').value;
  if(!from||!to||from===to) return;
  const m=getFavTags();
  for(const id in m){
    if(m[id].includes(from)){ const s=new Set(m[id]); s.delete(from); s.add(to); m[id]=[...s]; }
  }
  setFavTags(m);
  const cm=getFavTagColors();
  if(cm[from]!=null){ if(cm[to]==null) setFavTagColor(to, cm[from]); delete cm[from]; localStorage.setItem(FAVTAG_COLOR_KEY, JSON.stringify(cm)); }
  if(FAV_TAG_FILTER===from) FAV_TAG_FILTER=to;
  closeTagEditor(); rerenderFavSections();
  toast(LANG==='zh'?`已将「${from}」合并到「${to}」`:`Merged "${from}" into "${to}"`,'ok');
}
function closeTagEditor(){ document.getElementById('tagModal').style.display='none'; }
function setEditColor(c){ currentEditColor=c; renderTagSwatches(); }
function renderTagSwatches(){
  const box=document.getElementById('tagSwatches');
  const sw=FAVTAG_PALETTE.map(c=>`<button type="button" class="swatch ${c===currentEditColor?'on':''}" style="background:${c}" onclick="setEditColor('${c}')"></button>`).join('');
  const isCustom=currentEditColor && !FAVTAG_PALETTE.includes(currentEditColor);
  const custom=`<label class="swatch custom ${isCustom?'on':''}" style="background:${isCustom?currentEditColor:'#fff'}"><input type="color" value="${isCustom?currentEditColor:FAVTAG_DEFAULT_COLOR}" oninput="setEditColor(this.value)"><span>＋</span></label>`;
  box.innerHTML=sw+custom;
}
function saveTagEdit(){
  const nv=document.getElementById('tagNameInput').value.trim();
  const old=currentEditTag;
  const conflict = nv && nv!==old && allFavTags().includes(nv);
  if(nv && nv!==old){ if(renameFavTag(old,nv)){ if(FAV_TAG_FILTER===old) FAV_TAG_FILTER=nv; } }
  if(currentEditColor && !conflict) setFavTagColor(nv||old, currentEditColor);
  closeTagEditor(); rerenderFavSections();
  if(conflict) toast(LANG==='zh'?`已将「${old}」合并到「${nv}」`:`Merged "${old}" into "${nv}"`,'ok');
}

function renderFavTagBar(){
  const bar=document.getElementById('favTagBar');
  const tags=allFavTags();
  if(!tags.length){ bar.style.display='none'; bar.innerHTML=''; return; }
  const counts=tagCounts();
  const sorted=sortTagsByMode(tags,counts,TAG_SORT);
  bar.style.display='flex';
  bar.innerHTML = `<span class="tag-chip ${FAV_TAG_FILTER===''?'on':''}" onclick="filterFavByTag('')" data-i="fav_group_all"></span>`
    + sorted.map(tg=>`<span class="tag-chip ${FAV_TAG_FILTER===tg?'on':''}" style="--dot-c:${favTagColor(tg)}" onclick="filterFavByTag('${escJs(tg)}')" oncontextmenu="openTagCtx(event,'${escJs(tg)}')"><span class="dot"></span>${escHtml(tg)}<button class="chip-edit" title="${t('tag_edit')}" onclick="event.stopPropagation();openTagEditor('${escJs(tg)}')">✎</button></span>`).join('');
  applyI18n();
}

async function renderFav(){
  const grid=document.getElementById('favGrid');
  let ids=getFavs();
  if(FAV_TAG_FILTER){ const m=getFavTags(); ids=ids.filter(id=>(m[id]||[]).includes(FAV_TAG_FILTER)); }
  const list=await Promise.all(ids.map(id=>api('/api/robots/'+id).then(d=>d.robot).catch(()=>null)));
  const items=list.filter(Boolean);
  FAV_ITEMS=items;
  document.getElementById('clearFav').style.display=getFavs().length?'inline-flex':'none';
  document.getElementById('favAddCmp').style.display=getFavs().length?'inline-flex':'none';
  grid.innerHTML = items.length
    ? items.map(robotCard).join('')
    : `<div class="empty" style="grid-column:1/-1"><div class="e">⭐</div><h3 data-i="fav_empty"></h3><p data-i="fav_empty_sub"></p><a class="btn btn-primary" href="/catalog.html" data-i="browse" style="margin-top:18px"></a></div>`;
  applyI18n();
  renderFavTagBar();
  renderTagOverview();
  if(items.length) decorateFavCards(grid, items);
  if(SEL_MODE && !getFavs().length){ SEL_MODE=false; SEL.clear(); }
  markSelected();
  document.getElementById('selToggle').style.display=getFavs().length?'inline-flex':'none';
  syncSelUI();
}
// 统计每个标签被打在多少款机器人上（含收藏与最近浏览之外的标签）
function tagCounts(){
  const m=getFavTags(); const c={};
  for(const id in m){ (m[id]||[]).forEach(tg=>{ c[tg]=(c[tg]||0)+1; }); }
  return c;
}
function renderTagOverview(){
  const box=document.getElementById('tagOverview');
  const tags=allFavTags();
  const counts=tagCounts();
  if(!tags.length){
    box.style.display='block';
    box.innerHTML = `<div class="to-head"><span data-i="tag_overview"></span></div>`
      + `<div class="to-empty"><span data-i="tag_empty"></span> <span data-i="tag_empty_sub"></span></div>`;
    applyI18n();
    return;
  }
  box.style.display='block';
  const sorted=sortTagsByMode(tags,counts,TAG_SORT);
  const sortLabel=t('tag_sort_'+TAG_SORT);
  box.innerHTML = `<div class="to-head"><span data-i="tag_overview"></span><span class="to-sub" data-i="tag_overview_sub"></span><button class="to-sort" type="button" title="${t('tag_sort')}" onclick="toggleTagSort()">⇅ ${escHtml(sortLabel)}</button></div>`
    + `<div class="to-list">`
    + sorted.map(tg=>`<div class="to-item ${FAV_TAG_FILTER===tg?'on':''}" style="--dot-c:${favTagColor(tg)}" onclick="filterFavByTag('${escJs(tg)}')" oncontextmenu="openTagCtx(event,'${escJs(tg)}')" title="${escHtml(tg)}">
        <span class="dot"></span>
        <span class="to-name">${escHtml(tg)}</span>
        <span class="to-count">${counts[tg]||0}</span>
        <button class="chip-edit" title="${t('tag_edit')}" onclick="event.stopPropagation();openTagEditor('${escJs(tg)}')">✎</button>
      </div>`).join('')
    + `</div>`;
  applyI18n();
}
function sortTagsByMode(tags,counts,mode){
  const arr=[...tags];
  if(mode==='name') arr.sort((a,b)=>a.localeCompare(b));
  else if(mode==='count_asc') arr.sort((a,b)=>(counts[a]||0)-(counts[b]||0)||a.localeCompare(b));
  else arr.sort((a,b)=>(counts[b]||0)-(counts[a]||0)||a.localeCompare(b));
  return arr;
}
function toggleTagSort(){
  TAG_SORT = TAG_SORT==='count_desc' ? 'count_asc' : TAG_SORT==='count_asc' ? 'name' : 'count_desc';
  renderTagOverview();
  renderFavTagBar();
}
// 右键菜单：重命名 / 删除
function openTagCtx(ev,tag){
  ev.preventDefault(); ev.stopPropagation();
  const m=document.getElementById('tagCtxMenu');
  m.dataset.tag=tag;
  m.innerHTML = `<button type="button" onclick="ctxRename()">✎ ${t('tag_edit')}</button>`
    + `<button type="button" class="danger" onclick="ctxDelete()">🗑 ${t('tag_delete')}</button>`;
  m.style.display='block';
  const x=Math.min(ev.clientX, window.innerWidth-150), y=Math.min(ev.clientY, window.innerHeight-90);
  m.style.left=x+'px'; m.style.top=y+'px';
}
function closeTagCtx(){ const m=document.getElementById('tagCtxMenu'); if(m) m.style.display='none'; }
function ctxRename(){ const tg=document.getElementById('tagCtxMenu').dataset.tag; closeTagCtx(); openTagEditor(tg); }
function ctxDelete(){ const tg=document.getElementById('tagCtxMenu').dataset.tag; closeTagCtx(); deleteFavTagGlobal(tg); renderFav(); }
async function renderRecent(){
  const box=document.getElementById('recentGrid'), sec=document.getElementById('recentSection');
  const ids=getRecentIds();
  document.getElementById('recentAddCmp').style.display=ids.length?'inline-flex':'none';
  if(!ids.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  const list=await Promise.all(ids.map(id=>api('/api/robots/'+id).then(d=>d.robot).catch(()=>null)));
  const items=list.filter(Boolean);
  box.innerHTML = items.length ? items.map(robotCard).join('') : '';
  applyI18n();
  if(items.length) decorateFavCards(box, items);
  markSelected();
}
// 重新渲染收藏与最近浏览两个区，保持标签增删改后两处一致
async function rerenderFavSections(){ await Promise.all([renderFav(), renderRecent()]); }
function clearFavs(){ setFavs([]); FAV_TAG_FILTER=''; renderFav(); }

/* ---- 多选 + 批量打标签（选择持久化到跨页选择篮 rh_sel） ---- */
let SEL_MODE=false;
let SEL=getSel();
function syncSelUI(){
  const btn=document.getElementById('selToggle');
  if(btn){ btn.classList.toggle('on',SEL_MODE); btn.textContent = SEL_MODE ? (LANG==='zh'?'完成':'Done') : (LANG==='zh'?'选择':'Select'); }
  document.body.classList.toggle('selecting',SEL_MODE);
  updateBatchBar();
}
function toggleSelectMode(){
  SEL_MODE=!SEL_MODE;
  if(!SEL_MODE) clearSel();
  syncSelUI();
}
function onGridClick(e){
  if(!SEL_MODE) return;
  if(e.target.closest('button')||e.target.closest('a')||e.target.closest('input')) return;
  const card=e.target.closest('.rcard'); if(!card) return;
  const id=card.dataset.id; if(!id) return;
  if(SEL.has(id)) SEL.delete(id); else SEL.add(id);
  card.classList.toggle('sel',SEL.has(id));
  setSel(SEL);
  updateBatchBar();
}
function selectAll(){
  document.querySelectorAll('#favGrid .rcard, #recentGrid .rcard').forEach(c=>{ const id=c.dataset.id; if(id){ SEL.add(id); c.classList.add('sel'); } });
  setSel(SEL);
  updateBatchBar();
}
function clearSel(){
  // 仅移除当前可见的选中项，保留其他页面（如详情页）的选择
  document.querySelectorAll('#favGrid .rcard.sel, #recentGrid .rcard.sel').forEach(c=>{ SEL.delete(c.dataset.id); c.classList.remove('sel'); });
  setSel(SEL);
  updateBatchBar();
}
function markSelected(){
  document.querySelectorAll('#favGrid .rcard, #recentGrid .rcard').forEach(c=>{ c.classList.toggle('sel', SEL.has(c.dataset.id)); });
}
function updateBatchBar(){
  const bar=document.getElementById('batchBar');
  if(bar) bar.style.display = (SEL_MODE && SEL.size>0) ? 'flex' : 'none';
  const cnt=document.getElementById('batchCount'); if(cnt) cnt.textContent=SEL.size;
}
function applyTagToSelected(){
  const tag=document.getElementById('batchTag').value.trim(); if(!tag) return;
  const n=SEL.size;
  SEL.forEach(id=>addFavTag(id,tag));
  document.getElementById('batchTag').value='';
  clearSel();
  rerenderFavSections();
  toast(LANG==='zh'?`已给 ${n} 款打上「${tag}」`:`Tagged ${n} items with "${tag}"`,'ok');
}

async function init(){
  renderChrome('favorites'); await loadMeta();
  applyI18n(); renderTray();
  await Promise.all([renderFav(), renderRecent()]);
  document.getElementById('favGrid').addEventListener('click',onGridClick);
  document.getElementById('recentGrid').addEventListener('click',onGridClick);
  document.addEventListener('langchange',()=>{ renderFav(); renderRecent(); if(SEL_MODE) syncSelUI(); });
  document.addEventListener('favchange',()=>{ renderFav(); });
  document.addEventListener('selbasket',()=>{ SEL=getSel(); markSelected(); updateBatchBar(); });
  document.addEventListener('click',closeTagCtx);
  window.addEventListener('scroll',closeTagCtx,true);
}
init();
</script>
</body>
</html>
