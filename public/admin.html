<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · 管理台 — RobotHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>

<div id="gate" class="container" style="padding-top:90px;max-width:460px">
  <div class="cat-card" style="--c:var(--primary);text-align:center">
    <div class="ico" style="margin:0 auto 14px">🔐</div>
    <h3 data-i="admin_title"></h3>
    <p class="d" data-i="admin_login" style="margin-top:6px"></p>
    <div class="field" style="text-align:left;margin-top:18px">
      <label data-i="token"></label>
      <input id="tk" type="password" placeholder="robothub-admin-2026" onkeydown="if(event.key==='Enter')unlock()">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="unlock()" data-i="login"></button>
    <p id="gerr" style="color:var(--red);font-size:13px;margin-top:10px;display:none">Invalid token.</p>
  </div>
</div>

<div id="console" class="container hide" style="padding-top:32px">
  <div class="section-head"><div><h2 data-i="admin_title"></h2><p data-i="admin_sub"></p></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="who" style="font-size:13px;color:var(--muted)"></span>
      <button class="btn btn-ghost" onclick="logout()">Exit</button>
    </div>
  </div>

  <div id="demoBanner" class="demo-banner hide">🟡 <b>演示模式</b>：当前为静态部署，管理台改动仅保存在<strong>本浏览器</strong>（localStorage），不会写入服务器；刷新同浏览器可见，换设备/清缓存则丢失。产品库、品牌、对比页会实时反映这些改动。</div>

  <div class="tab-bar">
    <button id="tabRobots" class="on" onclick="switchTab('robots')" data-i="admin_robots"></button>
    <button id="tabRfq" onclick="switchTab('rfq')" data-i="admin_rfq"></button>
  </div>

  <div id="panelRobots">
    <div class="admin-toolbar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px">
      <input id="fq" class="hero-search" style="flex:1;min-width:190px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px" data-ph="search_robots" oninput="applyRobotFilters()">
      <select id="fcat" class="sort-sel" onchange="applyRobotFilters()">
        <option value="" data-i="all_categories"></option>
      </select>
      <select id="fcountry" class="sort-sel" onchange="applyRobotFilters()">
        <option value="" data-i="all_countries"></option>
      </select>
      <select id="fsort" class="sort-sel" onchange="applyRobotFilters()" title="Sort">
        <option value="year" data-i="sort_year"></option>
        <option value="payload" data-i="sort_payload"></option>
        <option value="name" data-i="sort_name"></option>
      </select>
      <select id="fperpage" class="sort-sel" onchange="robotPage=1;applyRobotFilters()" title="Per page">
        <option value="20">20</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="0" data-i="all"></option>
      </select>
      <button class="btn btn-primary" onclick="openForm()" data-i="add_robot"></button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:13px;color:var(--muted)"><span id="robotCount"></span></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="exportRobots()" data-i="exp_robots"></button>
        <button class="btn btn-ghost" onclick="exportBrands()" data-i="exp_brands"></button>
      </div>
    </div>
    <div style="overflow:auto">
      <table class="admin-table" id="robotTable"><thead><tr>
        <th>Brand</th><th>Model</th><th>Category</th><th data-i="spec_country">Origin</th><th data-i="spec_payload">Payload</th><th data-i="spec_year">Year</th><th></th>
      </tr></thead><tbody></tbody></table>
    </div>
    <div id="robotPager" class="pager" style="display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px"></div>
  </div>

  <div id="panelRfq" class="hide">
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px">
      <input id="rfqSearch" class="hero-search" style="flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px" data-ph="search_rfq" oninput="applyRfqFilter()">
      <select id="fstatus" class="sort-sel" onchange="applyRfqFilter()">
        <option value="" data-i="all_status"></option>
        <option value="pending" data-i="status_pending"></option>
        <option value="done" data-i="status_done"></option>
      </select>
      <button class="btn btn-ghost" onclick="exportRfq()" data-i="exp_rfq"></button>
      <span id="rfqCount" style="font-size:13px;color:var(--muted)"></span>
    </div>
    <div style="overflow:auto">
      <table class="admin-table" id="rfqTable"><thead><tr>
        <th>#</th><th>Robot</th><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Message</th><th data-i="rfq_status">Status</th><th data-i="spec_year">Date</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<!-- Robot form modal -->
<div class="modal-mask" id="formMask">
  <div class="modal">
    <h3 id="formTitle" data-i="add_robot"></h3>
    <p class="mdesc" id="formDesc"></p>
    <div class="field"><label>Brand</label><input id="f_brand" placeholder="FANUC"></div>
    <div class="field"><label>Brand (中文)</label><input id="f_brandZh" placeholder="发那科"></div>
    <div class="field"><label>Model</label><input id="f_model" placeholder="LR Mate 200iD"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>Category</label><select id="f_category"></select></div>
      <div class="field"><label>Autonomy</label><select id="f_autonomy"></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>Country</label><select id="f_country"></select></div>
      <div class="field"><label>Year</label><input id="f_year" type="number" placeholder="2025"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="field"><label data-i="spec_payload">Payload(kg)</label><input id="f_payload" type="number" step="0.1"></div>
      <div class="field"><label data-i="spec_reach">Reach(mm)</label><input id="f_reach" type="number"></div>
      <div class="field"><label data-i="spec_dof">DOF</label><input id="f_dof" type="number"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="field"><label data-i="spec_weight">Weight(kg)</label><input id="f_weight" type="number" step="0.1"></div>
      <div class="field"><label>Price(USD)</label><input id="f_price" type="number"></div>
      <div class="field"><label>Price text</label><input id="f_priceText" placeholder="$30,000"></div>
    </div>
    <div class="field"><label>Description (EN)</label><textarea id="f_descEn" rows="2" placeholder="Short English description"></textarea></div>
    <div class="field"><label>Description (中文)</label><textarea id="f_descZh" rows="2" placeholder="中文简述"></textarea></div>
    <div class="field"><label>Applications (comma separated)</label><input id="f_apps" placeholder="welding, assembly, pick & place"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px"><input id="f_featured" type="checkbox"> Featured</label>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeForm()" data-i="cancel"></button>
      <button class="btn btn-primary" onclick="saveRobot()" data-i="submit"></button>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY='admin_token';
let TOKEN=localStorage.getItem(TOKEN_KEY)||'';
let editingId=null;

function adminFetch(path,opts={}){
  if(STATIC_MODE) return staticAdminApi(path,opts);   // 静态演示模式：本地 localStorage 写
  return fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Admin-Token':TOKEN,...(opts.headers||{})}}).then(r=>r.json());
}
function unlock(){
  const v=document.getElementById('tk').value.trim();
  TOKEN=v||TOKEN;
  if(!TOKEN){return;}
  if(STATIC_MODE){
    // 演示模式：静态托管无服务器，任意非空令牌即可解锁；所有改动存于本浏览器 localStorage
    localStorage.setItem(TOKEN_KEY,TOKEN);
    document.getElementById('gate').classList.add('hide');
    document.getElementById('console').classList.remove('hide');
    const who=document.getElementById('who'); if(who) who.textContent='🟡 Demo · 本地数据';
    const banner=document.getElementById('demoBanner'); if(banner) banner.style.display='block';
    boot();
    return;
  }
  // verify token by hitting rfq endpoint
  fetch('/api/admin/rfq',{headers:{'X-Admin-Token':TOKEN}}).then(r=>{
    if(r.status===401){ document.getElementById('gerr').style.display='block'; TOKEN=''; return; }
    localStorage.setItem(TOKEN_KEY,TOKEN);
    document.getElementById('gate').classList.add('hide');
    document.getElementById('console').classList.remove('hide');
    document.getElementById('who').textContent='🟢 '+TOKEN.slice(0,8)+'…';
    boot();
  });
}
function logout(){ TOKEN=''; localStorage.removeItem(TOKEN_KEY); location.reload(); }

async function boot(){
  renderChrome('admin'); await loadMeta();
  fillSelects(); applyI18n(); renderTray();
  loadRobots();
}
function fillSelects(){
  const C=META.categories,A=META.autonomyLevels,CO=Object.entries(META.countries);
  document.getElementById('f_category').innerHTML=C.map(c=>`<option value="${c.id}">${LANG==='zh'?c.zh:c.en}</option>`).join('');
  document.getElementById('f_autonomy').innerHTML=A.map(a=>`<option value="${a.id}">${LANG==='zh'?a.zh:a.en}</option>`).join('');
  document.getElementById('f_country').innerHTML=CO.map(([k,v])=>`<option value="${k}">${v.flag} ${LANG==='zh'?v.zh:v.en}</option>`).join('');
  // 筛选下拉：分类 / 国家
  document.getElementById('fcat').innerHTML='<option value="" data-i="all_categories"></option>'+C.map(c=>`<option value="${c.id}">${LANG==='zh'?c.zh:c.en}</option>`).join('');
  document.getElementById('fcountry').innerHTML='<option value="" data-i="all_countries"></option>'+CO.map(([k,v])=>`<option value="${k}">${v.flag} ${LANG==='zh'?v.zh:v.en}</option>`).join('');
}
function switchTab(t){
  document.getElementById('tabRobots').classList.toggle('on',t==='robots');
  document.getElementById('tabRfq').classList.toggle('on',t==='rfq');
  document.getElementById('panelRobots').classList.toggle('hide',t!=='robots');
  document.getElementById('panelRfq').classList.toggle('hide',t!=='rfq');
  if(t==='robots') loadRobots(); else loadRfq();
}

let ROBOTS=[];   // 全量缓存，用于客户端即时筛选
let robotPage=1; // 当前分页
async function loadRobots(){
  const d=await api('/api/robots?limit=1000');
  ROBOTS=d.items||[];
  robotPage=1;
  applyRobotFilters();
}
function getFilteredRobots(){
  const q=(document.getElementById('fq').value||'').trim().toLowerCase();
  const cat=document.getElementById('fcat').value;
  const country=document.getElementById('fcountry').value;
  const list=ROBOTS.filter(r=>{
    if(cat && r.category!==cat) return false;
    if(country && r.country!==country) return false;
    if(q){ const hay=(r.brand+' '+(r.brandZh||'')+' '+r.model).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const sort=document.getElementById('fsort').value;
  list.sort((a,b)=>{
    if(sort==='payload') return (b.payload||0)-(a.payload||0);
    if(sort==='name') return (a.brand+a.model).localeCompare(b.brand+b.model);
    return (b.year||0)-(a.year||0);   // default: newest first
  });
  return list;
}
function applyRobotFilters(){
  const catName=id=>{const c=(META.categories||[]).find(x=>x.id===id);return c?(LANG==='zh'?c.zh:c.en):id;};
  const list=getFilteredRobots();
  // 分页
  const pageSize=parseInt(document.getElementById('fperpage').value||'50',10);
  const total=list.length;
  const totalPages = pageSize>0 ? Math.max(1, Math.ceil(total/pageSize)) : 1;
  if(robotPage>totalPages) robotPage=totalPages;
  const start=(pageSize>0)?(robotPage-1)*pageSize:0;
  const pageItems = pageSize>0 ? list.slice(start, start+pageSize) : list;

  const tb=document.querySelector('#robotTable tbody');
  tb.innerHTML=pageItems.map(r=>`<tr>
    <td><b>${r.brand}</b>${r.brandZh?'<br><span style="color:var(--muted);font-size:12px">'+r.brandZh+'</span>':''}</td>
    <td>${r.model}</td>
    <td><span class="tag cat" style="--c:var(--primary)">${catName(r.category)}</span></td>
    <td>${r.countryInfo?r.countryInfo.flag+' '+(LANG==='zh'?r.countryInfo.zh:r.countryInfo.en):r.country}</td>
    <td>${r.payload!=null?r.payload+'kg':'—'}</td>
    <td>${r.year||'—'}</td>
    <td><span class="op" onclick="openForm('${r.id}')" data-i="edit"></span><span class="op del" onclick="delRobot('${r.id}')" data-i="del"></span></td>
  </tr>`).join('');
  const cnt=document.getElementById('robotCount');
  if(cnt) cnt.textContent = LANG==='zh' ? `共 ${total} 款（库内 ${ROBOTS.length}）` : `${total} of ${ROBOTS.length} robots`;
  renderRobotPager(totalPages);
  applyI18n();
}
function renderRobotPager(totalPages){
  const box=document.getElementById('robotPager');
  if(!box) return;
  if(totalPages<=1){ box.innerHTML=''; return; }
  let html=`<button class="btn btn-ghost" onclick="robotPage=Math.max(1,robotPage-1);applyRobotFilters()" ${robotPage<=1?'disabled':''}>‹ ${t('prev')}</button>`;
  html+=`<span style="font-size:13px;color:var(--muted)">${t('page_info').replace('{p}',robotPage).replace('{n}',totalPages)}</span>`;
  html+=`<button class="btn btn-ghost" onclick="robotPage=Math.min(${totalPages},robotPage+1);applyRobotFilters()" ${robotPage>=totalPages?'disabled':''}>${t('next')} ›</button>`;
  box.innerHTML=html;
}
let RFQS=[];   // 全量缓存，用于询盘客户端即时搜索
async function loadRfq(){
  const list=await adminFetch('/api/admin/rfq');
  RFQS=Array.isArray(list)?list:[];
  applyRfqFilter();
}
function applyRfqFilter(){
  const q=(document.getElementById('rfqSearch').value||'').trim().toLowerCase();
  const st=document.getElementById('fstatus').value;
  const list=RFQS.filter(r=>{
    r.status=r.status||'pending';
    if(st && r.status!==st) return false;
    if(!q) return true;
    const hay=[r.id,r.robotId,r.name,r.company,r.email,r.phone,r.message].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  const tb=document.querySelector('#rfqTable tbody');
  tb.innerHTML=list.map(r=>{
    const done=(r.status||'pending')==='done';
    const badge=done?`<span class="tag ok">✓ ${t('status_done')}</span>`:`<span class="tag warn">• ${t('status_pending')}</span>`;
    const btn=done?`<span class="op" title="${t('mark_pending')}" onclick="toggleRfqStatus(${r.id},'pending')">↺</span>`:`<span class="op" title="${t('mark_done')}" onclick="toggleRfqStatus(${r.id},'done')">✓</span>`;
    return `<tr>
      <td>${r.id}</td><td>${r.robotId||'—'}</td><td>${r.name||''}</td><td>${r.company||''}</td>
      <td>${r.email||''}</td><td>${r.phone||''}</td><td style="max-width:220px">${r.message||''}</td>
      <td>${badge}<br>${btn}</td>
      <td style="white-space:nowrap">${(r.createdAt||'').slice(0,10)}</td>
    </tr>`;
  }).join('');
  const cnt=document.getElementById('rfqCount');
  if(cnt) cnt.textContent = LANG==='zh' ? `共 ${list.length} 条（总 ${RFQS.length}）` : `${list.length} of ${RFQS.length}`;
  applyI18n();
}
async function toggleRfqStatus(id, status){
  await adminFetch('/api/admin/rfq/'+id, {method:'PATCH', body:JSON.stringify({status})});
  loadRfq();
}

function openForm(id){
  editingId=id||null;
  document.getElementById('formTitle').textContent=id?t('edit'):t('add_robot');
  document.getElementById('formDesc').textContent=id?'':'';
  const ids=['brand','brandZh','model','category','autonomy','country','year','payload','reach','dof','weight','price','priceText','descEn','descZh','apps','featured'];
  ids.forEach(k=>{const el=document.getElementById('f_'+k);if(el){if(el.type==='checkbox')el.checked=false;else el.value='';}});
  if(id){
    api('/api/robots/'+id).then(d=>{const r=d.robot;
      ['brand','brandZh','model','category','autonomy','country','year','payload','reach','dof','weight','price','priceText','descEn','descZh'].forEach(k=>{const el=document.getElementById('f_'+k);if(el&&r[k]!=null)el.value=r[k];});
      document.getElementById('f_featured').checked=!!r.featured;
      document.getElementById('f_apps').value=(r.apps||[]).join(', ');
    });
  }
  document.getElementById('formMask').classList.add('show');
}
function closeForm(){ document.getElementById('formMask').classList.remove('show'); }
async function saveRobot(){
  const get=(k)=>{const el=document.getElementById('f_'+k);return el?el.value.trim():'';};
  const num=(k)=>{const v=document.getElementById('f_'+k).value;return v===''||v==null?null:Number(v);};
  const body={
    brand:get('brand'), brandZh:get('brandZh'), model:get('model'),
    category:get('category'), autonomy:get('autonomy'), country:get('country'),
    year:num('year'), payload:num('payload'), reach:num('reach'), dof:num('dof'),
    weight:num('weight'), price:num('price'), priceText:get('priceText'),
    descEn:get('descEn'), descZh:get('descZh'),
    apps:get('apps').split(',').map(s=>s.trim()).filter(Boolean),
    featured:document.getElementById('f_featured').checked
  };
  if(!body.brand||!body.model){ alert('Brand & Model required'); return; }
  let res;
  if(editingId) res=await adminFetch('/api/admin/robots/'+editingId,{method:'PUT',body:JSON.stringify(body)});
  else res=await adminFetch('/api/admin/robots',{method:'POST',body:JSON.stringify(body)});
  if(res.ok){ closeForm(); loadRobots(); }
  else alert('Error: '+(res.error||'unknown'));
}
async function delRobot(id){
  if(!confirm('Delete this robot?')) return;
  const res=await adminFetch('/api/admin/robots/'+id,{method:'DELETE'});
  if(res.ok) loadRobots(); else alert('Delete failed');
}

/* ---- CSV exports (respect current filters) ---- */
function exportRobots(){
  const list=getFilteredRobots();
  const header=['id','brand','brandZh','model','category','autonomy','country','payload','reach','dof','weight','price','priceText','year','featured','descEn','descZh','apps'];
  const rows=list.map(r=>[r.id,r.brand,r.brandZh,r.model,r.category,r.autonomy,r.country,r.payload,r.reach,r.dof,r.weight,r.price,r.priceText,r.year,r.featured?1:0,r.descEn,r.descZh,(r.apps||[]).join('|')]);
  exportCsv('robothub_robots_'+list.length+'.csv', header, rows);
}
function exportRfq(){
  const st=document.getElementById('fstatus').value;
  const q=(document.getElementById('rfqSearch').value||'').trim().toLowerCase();
  const list=RFQS.filter(r=>{
    r.status=r.status||'pending';
    if(st && r.status!==st) return false;
    if(!q) return true;
    const hay=[r.id,r.robotId,r.name,r.company,r.email,r.phone,r.message].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  const header=['id','robotId','name','company','email','phone','message','status','createdAt'];
  const rows=list.map(r=>[r.id,r.robotId,r.name,r.company,r.email,r.phone,r.message,r.status||'pending',r.createdAt]);
  exportCsv('robothub_rfq_'+list.length+'.csv', header, rows);
}
function exportBrands(){
  const list=_staticBrands();
  const header=['brand','brandZh','country','models','categories'];
  const rows=list.map(b=>[b.brand,b.brandZh,b.country,b.c,(b.cats||[]).join('|')]);
  exportCsv('robothub_brands_'+list.length+'.csv', header, rows);
}

// init gate
document.addEventListener('langchange',()=>{ if(!document.getElementById('console').classList.contains('hide')){ applyI18n(); loadRobots(); } });
// 静态演示模式：加载即自动解锁，免去登录门槛（真实服务端模式仍走令牌校验）
if(STATIC_MODE){ document.getElementById('tk').value='robothub-admin-2026'; unlock(); }
else if(TOKEN){ unlock(); }
else { renderChrome('admin'); }
</script>
</body>
</html>
