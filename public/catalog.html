<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="浏览 RobotHub 全球机器人产品库，按类目、品牌、国家与自主度筛选工业、协作、人形、移动、医疗与服务机器人。">
<title>Catalog · 产品库 — RobotHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>

<div class="container" style="padding-top:32px">
  <div class="section-head"><div><h2 data-i="nav_catalog"></h2><p id="catSub"></p></div></div>
  <div class="cat-hero" id="catHero" style="display:none"></div>
  <div class="catalog">
    <aside class="filters" id="filters">
      <div class="filters-head">
        <h4 data-i="filters"></h4>
        <button class="filters-toggle" id="filtersToggle" type="button" onclick="toggleFiltersPanel()" aria-expanded="true" aria-label="筛选">☰</button>
      </div>
      <div class="filter-body" id="filterBodyWrap">
        <div id="filterBody"></div>
        <button class="reset" onclick="resetFilters()" data-i="reset"></button>
      </div>
    </aside>
    <main class="catalog-main">
      <div class="toolbar">
        <div class="count"><b id="cnt">0</b> <span data-i="results"></span></div>
        <div class="cat-search">
          <svg class="cs-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M21 20.3l-5.6-5.6a7 7 0 10-.7.7l5.6 5.6.7-.7zM4.5 10.5a6 6 0 1112 0 6 6 0 01-12 0z"/></svg>
          <input id="catSearch" class="cs-input" type="text" data-ph="search_robots" autocomplete="off" oninput="onCatSearch(this.value)">
          <button class="cs-clear" id="catSearchClear" type="button" onclick="clearCatSearch()" aria-label="清除搜索" style="display:none">×</button>
        </div>
        <div class="toolbar-right">
          <div class="bulk-sel">
            <span class="bulk-prog clickable" id="bulkPageProg" role="button" tabindex="0" title="点击仅看本页已选"></span><span class="bulk-bar" title="本页选择进度"><span class="bulk-bar-fill" id="bulkBarFill"></span></span><span class="bulk-sep">·</span><span class="bulk-prog global clickable" id="bulkGlobalProg" role="button" tabindex="0" title="点击查看已选清单"></span>
            <button class="bs-btn" type="button" id="bsPageBtn" onclick="selectAllPage()"></button>
            <button class="bs-btn" type="button" id="bsCatBtn" onclick="selectAllCat()"></button>
            <button class="bs-btn" type="button" id="bsInvBtn" onclick="invertPage()"></button>
            <button class="bs-btn bs-danger" type="button" id="bsClearBtn" onclick="clearAllSel()"></button>
          </div>
          <div class="view-toggle" id="viewToggle">
            <button class="vt" data-v="grid" onclick="setView('grid')" aria-label="网格视图" title="网格">▦</button>
            <button class="vt" data-v="list" onclick="setView('list')" aria-label="列表视图" title="列表">▤</button>
          </div>
          <div>
            <span data-i="sort_by" style="font-size:13.5px;color:var(--muted);margin-right:6px"></span>
            <select id="sort" onchange="onSortChange(this.value)">
              <option value="relevance" data-i="sort_relevance"></option>
              <option value="featured" data-i="sort_featured"></option>
              <option value="year" data-i="sort_year"></option>
              <option value="payload" data-i="sort_payload"></option>
              <option value="price" data-i="sort_price"></option>
              <option value="views" data-i="sort_views"></option>
            <option value="name" data-i="sort_name"></option>
            </select>
          </div>
        </div>
      </div>
      <div class="active-filters" id="activeFilters"></div>
      <div class="robot-grid" id="grid"></div>
      <div id="sentinel"></div>
      <div id="footer"></div>
    </main>
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const _ub=params.get('brand');
const state={ category:params.get('category')||'', brands:(_ub?_ub.split(',').filter(Boolean):[]), country:params.get('country')||'',
  autonomy:params.get('autonomy')||'', q:params.get('q')||'', featured:params.get('featured')||'',
  sort:params.get('sort')|| (params.get('q') ? 'relevance' : 'featured'), page:1, limit:24,
  view:localStorage.getItem('cat_view')||'grid', brandQ:'' };
let BRANDS=[];      // 品牌列表（含计数），init 时拉取一次
let ALL=[];         // 已加载机器人（无限滚动累加）
let DATA=null;      // 最近一次接口结果（total/hero 等）
let TOTAL=0, loading=false, finished=false;

function buildFilters(){
  if(!META || !META.stats) return;   // 兜底：meta 尚未加载完成时不要在 stats 上崩溃
  const s=META.stats;
  const grp=(title,key,opts)=>`<div class="filter-group"><h4 data-i="${title}"></h4>
    <div class="filter-opt ${!state[key]?'on':''}" onclick="setF('${key}','')"><span data-i="all"></span></div>
    ${opts.map(o=>`<div class="filter-opt ${state[key]===o.id?'on':''}" onclick="setF('${key}','${o.id}')"><span>${o.label}</span><span class="n">${o.n??''}</span></div>`).join('')}</div>`;
  const cats=META.categories.map(c=>({id:c.id,label:LANG==='zh'?c.zh:c.en,n:s.catCounts[c.id]||0}));
  const autos=META.autonomyLevels.map(a=>({id:a.id,label:LANG==='zh'?a.zh:a.en}));
  const countries=Object.entries(META.countries).filter(([k])=>s.countryCounts[k]).sort((a,b)=>(s.countryCounts[b[0]]||0)-(s.countryCounts[a[0]]||0)).map(([k,v])=>({id:k,label:(v.flag+' '+(LANG==='zh'?v.zh:v.en)),n:s.countryCounts[k]}));
  const brandGroup=`<div class="filter-group brand-group">
      <h4 data-i="f_brand"></h4>
      <input class="brand-search" id="brandSearch" placeholder="${t('brand_search')}" value="${state.brandQ}" oninput="onBrandSearch(this.value)">
      <div class="brand-list" id="brandList"></div>
    </div>`;
  document.getElementById('filterBody').innerHTML=grp('f_category','category',cats)+grp('f_autonomy','autonomy',autos)+grp('f_country','country',countries)+brandGroup;
  applyI18n();
  renderBrandList();
}
function renderBrandList(){
  state.brandQ=(document.getElementById('brandSearch')||{}).value||state.brandQ||'';
  const box=document.getElementById('brandList'); if(!box) return;
  const q=state.brandQ.trim().toLowerCase();
  const list=BRANDS.filter(b=>(b.brand&&b.brand.toLowerCase().includes(q))||(b.brandZh&&b.brandZh.toLowerCase().includes(q))).slice(0,60);
  const selN=state.brands.length;
  box.innerHTML=`<div class="filter-opt ${!selN?'on':''}" data-brand="" onclick="setBrand('')"><span data-i="all"></span>${selN?`<span class="n">${selN}</span>`:''}</div>`+
    list.map(b=>`<div class="filter-opt ${state.brands.includes(b.brand)?'on':''}" data-brand="${b.brand.replace(/"/g,'&quot;')}" onclick="setBrand(this.dataset.brand)"><span class="cbx">${state.brands.includes(b.brand)?'✓':''}</span><span>${LANG==='zh'?(b.brandZh||b.brand):b.brand}</span><span class="n">${b.c||''}</span></div>`).join('');
}
function onBrandSearch(v){ state.brandQ=v; renderBrandList(); }
function setBrand(b){
  if(b===''){ state.brands=[]; }
  else { const i=state.brands.indexOf(b); if(i>=0) state.brands.splice(i,1); else state.brands.push(b); }
  state.page=1; buildFilters(); load(true); syncUrl();
}
function setF(k,v){ state[k]=v; state.page=1; buildFilters(); load(true); syncUrl(); }
function resetFilters(){ Object.assign(state,{category:'',brands:[],country:'',autonomy:'',q:'',featured:'',page:1,brandQ:''}); const cs=document.getElementById('catSearch'); if(cs)cs.value=''; const cc=document.getElementById('catSearchClear'); if(cc)cc.style.display='none'; syncSortOptions(); buildFilters(); load(true); syncUrl(); }

/* ---- Collapsible filters (mobile) ---- */
function toggleFiltersPanel(){
  const f=document.getElementById('filters'); if(!f) return;
  const c=f.classList.toggle('collapsed');
  const t=document.getElementById('filtersToggle'); if(t) t.setAttribute('aria-expanded', c?'false':'true');
}

/* ---- Active filter chips (visible, individually removable) ---- */
function renderActiveFilters(){
  const box=document.getElementById('activeFilters'); if(!box) return;
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const chip=(fn,label)=>`<button class="af-chip" type="button" onclick="${fn}"><span>${esc(label)}</span><span class="af-x" aria-hidden="true">×</span></button>`;
  const chips=[];
  if(state.category){ const c=META.categories.find(x=>x.id===state.category); chips.push(chip(`setF('category','')`, (LANG==='zh'?'类目 · ':'Cat · ')+(c?(LANG==='zh'?c.zh:c.en):state.category))); }
  if(state.brands.length){ state.brands.forEach(b=>{ const br=BRANDS.find(x=>x.brand===b); chips.push(chip(`setBrand('${esc(b)}')`, (LANG==='zh'?'品牌 · ':'Brand · ')+(br?(LANG==='zh'?(br.brandZh||br.brand):br.brand):b))); }); }
  if(state.country){ const c=META.countries[state.country]; chips.push(chip(`setF('country','')`, (LANG==='zh'?'国家 · ':'Country · ')+(c?(LANG==='zh'?c.zh:c.en):state.country))); }
  if(state.autonomy){ const a=META.autonomyLevels.find(x=>x.id===state.autonomy); chips.push(chip(`setF('autonomy','')`, (LANG==='zh'?'自主度 · ':'Autonomy · ')+(a?(LANG==='zh'?a.zh:a.en):state.autonomy))); }
  if(state.q) chips.push(chip(`clearCatSearch()`, (LANG==='zh'?'搜索 · ':'Search · ')+state.q));
  if(state.featured) chips.push(chip(`setF('featured','')`, LANG==='zh'?'精选':'Featured'));
  if(chips.length){
    box.innerHTML=`<span class="af-label">${LANG==='zh'?'已选筛选':'Filters'}</span>`+chips.join('')+`<button class="af-clear" type="button" onclick="resetFilters()">${LANG==='zh'?'清除全部':'Clear all'}</button>`;
    box.classList.add('show');
  } else { box.innerHTML=''; box.classList.remove('show'); }
}

let _catSearchT=null;
let sortTouched = !!params.get('sort');   // 用户是否手动指定过排序（URL 带 sort 也算）
function onSortChange(v){ sortTouched=true; state.sort=v; state.page=1; load(true); syncUrl(); }
// 「相关性」仅在有关键词时可用；无词时自动回落到精选优先
function syncSortOptions(){
  const sel=document.getElementById('sort'); if(!sel) return;
  const rel=sel.querySelector('option[value="relevance"]'); if(!rel) return;
  const on=!!state.q;
  rel.disabled=!on;
  rel.style.display=on?'':'none';
  if(!on && state.sort==='relevance') state.sort='featured';
  if(on && !sortTouched && state.sort==='featured') state.sort='relevance';
  sel.value=state.sort;
}
function onCatSearch(v){
  const cc=document.getElementById('catSearchClear'); if(cc) cc.style.display = v? 'block':'none';
  clearTimeout(_catSearchT);
  _catSearchT=setTimeout(()=>{ state.q=v.trim(); state.page=1; syncSortOptions(); load(true); syncUrl(); }, 280);
}
function clearCatSearch(){ const cs=document.getElementById('catSearch'); if(cs)cs.value=''; state.q=''; const cc=document.getElementById('catSearchClear'); if(cc)cc.style.display='none'; state.page=1; syncSortOptions(); load(true); syncUrl(); }
function syncUrl(){
  try{
    const qs=new URLSearchParams();
    ['category','country','autonomy','sort'].forEach(k=>{ if(state[k]) qs.set(k,state[k]); });
    if(state.brands.length) qs.set('brand', state.brands.join(','));
    if(state.q) qs.set('q', state.q);
    if(state.featured) qs.set('featured', state.featured);
    const url=location.pathname + (qs.toString()?'?'+qs.toString():'');
    history.replaceState(null,'',url);
  }catch(e){}
}
function renderEmpty(on){
  const grid=document.getElementById('grid'); if(!grid) return;
  if(on){
    grid.className='robot-grid';
    grid.innerHTML=`<div class="cat-empty">
      <div class="ce-ico">🔍</div>
      <h3 data-i="empty_title"></h3>
      <p data-i="empty_sub"></p>
      <button class="btn btn-primary" type="button" onclick="resetFilters()" data-i="reset"></button>
    </div>`;
    applyI18n();
  }
}

function setView(v){ state.view=v; localStorage.setItem('cat_view',v); updateViewBtns(); renderItems(); }
function updateViewBtns(){ document.querySelectorAll('#viewToggle .vt').forEach(b=>b.classList.toggle('on', b.dataset.v===state.view)); }

function addManyToSel(ids){
  try{
    const s=getSel(); let added=0;
    (ids||[]).forEach(id=>{ if(!s.has(id)){ s.add(id); added++; } });
    if(added>0){ setSel(s); if(typeof toast==='function') toast((LANG==='zh'?'已加入选择篮 ':'Added ')+added+(LANG==='zh'?' 项':' to selection')); }
  }catch(e){}
}
function selectAllPage(){ addManyToSel(ALL.map(r=>r.id)); }
function selectAllCat(){
  const cat=state.category; let ids=[];
  const all=(window.ROBOTHUB_ROBOTS)||(ALL||[]);
  ids = cat ? all.filter(r=>r.category===cat).map(r=>r.id) : all.map(r=>r.id);
  addManyToSel(ids);
}
function pageSelCount(){ try{ return ALL.filter(r=>getSel().has(r.id)).length; }catch(e){ return 0; } }
function updateBulkBtns(){
  const X=pageSelCount(), Y=ALL.length, N=getSel().size;
  const pp=document.getElementById('bulkPageProg'); if(pp){ pp.textContent=(LANG==='zh'?`本页 ${X}/${Y} 已选`:`Page ${X}/${Y}`); pp.onclick=togglePageList; }
  const gp=document.getElementById('bulkGlobalProg'); if(gp){ gp.textContent=(LANG==='zh'?`累计 ${N} 项`:`${N} total`); gp.onclick=toggleGlobalList; }
  const bf=document.getElementById('bulkBarFill'); if(bf) bf.style.width=(Y?Math.round(X/Y*100):0)+'%';
  const bp=document.getElementById('bsPageBtn'); if(bp) bp.textContent=(LANG==='zh'?'全选本页':'Select page');
  const bc=document.getElementById('bsCatBtn'); if(bc) bc.textContent= state.category ? (LANG==='zh'?'全选本类目':'Select category') : (LANG==='zh'?'全选全部':'Select all');
  const bi=document.getElementById('bsInvBtn'); if(bi) bi.textContent=(LANG==='zh'?'反选本页':'Invert page');
  const bcl=document.getElementById('bsClearBtn'); if(bcl) bcl.textContent=(LANG==='zh'?'取消全选':'Clear all');
}
function invertPage(){
  try{ const s=getSel(); ALL.forEach(r=>{ if(s.has(r.id)) s.delete(r.id); else s.add(r.id); }); setSel(s); }catch(e){}
}
function clearAllSel(){ try{ setSel(new Set()); }catch(e){} }
function toggleGlobalList(){ try{ if(getSel().size>0) toggleSelList('all'); }catch(e){} }
function togglePageList(){ try{ if(getSel().size>0) toggleSelList('page'); }catch(e){} }
function renderItems(){
  const grid=document.getElementById('grid');
  try{ setHighlightQuery(state.q||''); }catch(e){}   // 让卡片渲染时高亮命中关键词
  if(!ALL.length){ grid.innerHTML=''; return; }
  grid.className='robot-grid'+(state.view==='list'?' list':'');
  grid.innerHTML=state.view==='list'?ALL.map(robotListRow).join(''):ALL.map(robotCard).join('');
  applyI18n(); markCatalogSel(); updateBulkBtns();
}

async function load(reset){
  if(loading) return;
  if(reset){ state.page=1; ALL=[]; finished=false; }
  loading=true; updateFooter();
  const grid=document.getElementById('grid');
  if(reset && !ALL.length) grid.innerHTML=Array(8).fill('<div class="skeleton"></div>').join('');
  const qs=new URLSearchParams();
  ['category','country','autonomy','q','featured','sort','page','limit'].forEach(k=>{ if(state[k]) qs.set(k,state[k]); });
  if(state.brands.length) qs.set('brand', state.brands.join(','));
  const data=await api('/api/robots?'+qs.toString());
  DATA=data; TOTAL=data.total;
  if(reset) ALL=data.items; else ALL=ALL.concat(data.items);
  document.getElementById('cnt').textContent=data.total;
  const bt=state.brands.length? (state.brands.length+' '+(LANG==='zh'?'个品牌':'brands')+' · ') : '';
  let sub=bt+(state.q?('“'+state.q+'”'):'');
  if(state.q && state.sort==='relevance') sub += ' · '+t('res_sorted_rel');
  document.getElementById('catSub').textContent=sub;
  const ch=document.getElementById('catHero');
  if(state.category){ const c=META.categories.find(x=>x.id===state.category);
    if(c){ ch.className='cat-hero cat-'+state.category; ch.style.display='flex';
      ch.innerHTML=`<div class="ico">${c.icon}</div><div><h2>${LANG==='zh'?c.zh:c.en}</h2><p>${LANG==='zh'?c.desc_zh:c.desc_en}</p></div><div class="cnt">${data.total} ${LANG==='zh'?'款':'models'}</div>`;
    } else { ch.style.display='none'; }
  } else { ch.style.display='none'; }
  finished=(data.page>=(data.pages||data.totalPages||1));
  loading=false;
  renderItems();
  renderActiveFilters();
  if(finished && ALL.length===0) renderEmpty(true);
  updateFooter();
}
function updateFooter(){
  const f=document.getElementById('footer'); if(!f) return;
  if(loading){ f.innerHTML='<div class="load-spin">⟳ '+t('loading')+'</div>'; return; }
  if(finished){ f.innerHTML = ALL.length? '<div class="load-end">✓ '+t('loaded_all').replace('{n}',TOTAL)+'</div>' : ''; return; }
  if(typeof IntersectionObserver==='undefined'){ f.innerHTML='<button class="load-more-btn" onclick="loadMore()">'+t('load_more')+'</button>'; }
  else { f.innerHTML=''; }
}
function loadMore(){ if(loading||finished) return; state.page++; load(false); }

let _io=null;
function setupObserver(){
  const sentinel=document.getElementById('sentinel');
  if(!sentinel || typeof IntersectionObserver==='undefined') return;
  _io=new IntersectionObserver((es)=>{ es.forEach(e=>{ if(e.isIntersecting) loadMore(); }); }, {rootMargin:'400px 0px'});
  _io.observe(sentinel);
}

async function init(){
  renderChrome('catalog'); await loadMeta();
  BRANDS=await api('/api/brands');
  syncSortOptions();
  document.getElementById('sort').value=state.sort;
  updateViewBtns();
  applyI18n(); renderTray(); buildFilters();
  if(window.innerWidth<=960){ const f=document.getElementById('filters'); if(f) f.classList.add('collapsed'); }
  document.addEventListener('selbasket', ()=>{ markCatalogSel(); updateBulkBtns(); });
  const cs=document.getElementById('catSearch'); if(cs){ cs.value=state.q||''; const cc=document.getElementById('catSearchClear'); if(cc) cc.style.display=state.q?'block':'none'; }
  load(true); setupObserver();
  document.addEventListener('langchange',()=>{ buildFilters(); load(true); });
}
init();
</script>
</body>
</html>
