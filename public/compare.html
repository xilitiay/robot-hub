<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare · 对比 — RobotHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/app.js"></script>

<div class="container" style="padding:32px 0 60px">
  <div class="section-head"><div><h2 data-i="cmp_title"></h2></div>
    <button class="btn btn-ghost cmp-export" id="expBtn" onclick="exportCsv()" style="display:none" data-i="cmp_export"></button>
  </div>
  <div id="root"></div>
</div>

<script>
let CMP_ITEMS=[];
function bestIndex(vals, dir){ // dir 'max' or 'min'
  let bi=-1, bv=null;
  vals.forEach((v,i)=>{ if(v==null||isNaN(v)) return; if(bv===null||(dir==='max'?v>bv:v<bv)){bv=v;bi=i;} });
  return bi;
}
function buildRows(){
  return [
    { label:t('spec_brand'), get:r=>LANG==='zh'?(r.brandZh||r.brand):r.brand, csv:true },
    { label:t('spec_category'), get:r=>{const c=META.categories.find(x=>x.id===r.category);return LANG==='zh'?c.zh:c.en;} },
    { label:t('spec_autonomy'), get:r=>{const a=META.autonomyLevels.find(x=>x.id===r.autonomy);return LANG==='zh'?a.zh:a.en;} },
    { label:t('spec_country'), get:r=>r.countryInfo?(LANG==='zh'?r.countryInfo.zh:r.countryInfo.en):'—' },
    { label:t('spec_payload')+' (kg)', get:r=>r.payload, num:'max' },
    { label:t('spec_reach')+' (mm)', get:r=>r.reach, num:'max' },
    { label:t('spec_dof'), get:r=>r.dof, num:'max' },
    { label:t('spec_weight')+' (kg)', get:r=>r.weight, num:'min' },
    { label:t('spec_year'), get:r=>r.year, num:'max' },
    { label:t('spec_price'), get:r=>r.priceText },
  ];
}
function csvCell(v){ if(v==null||v==='') v='—'; return '"'+String(v).replace(/"/g,'""')+'"'; }
function exportCsv(){
  if(!CMP_ITEMS.length) return;
  const rows=buildRows();
  const head=['Model', ...CMP_ITEMS.map(r=>r.brand+' '+r.model)];
  let lines=[head.map(csvCell).join(',')];
  rows.forEach(row=>{ lines.push([row.label, ...CMP_ITEMS.map(r=>{let v=row.get(r); if(v==null||v==='')v='—'; return v;})].map(csvCell).join(',')); });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='robothub-compare.csv'; a.click(); URL.revokeObjectURL(a.href);
}
async function render(){
  const ids=getCmp();
  const root=document.getElementById('root');
  if(!ids.length){ root.innerHTML=`<div class="empty"><div class="e">⚖️</div><p data-i="cmp_empty"></p><a class="btn btn-primary" style="margin-top:16px" href="/catalog.html" data-i="nav_catalog"></a></div>`; applyI18n(); document.getElementById('expBtn').style.display='none'; return; }
  const d=await api('/api/compare?ids='+ids.join(','));
  const items=d.items; CMP_ITEMS=items;
  document.getElementById('expBtn').style.display=items.length?'inline-flex':'none';
  const rows=buildRows();
  let h='<div style="overflow-x:auto"><table class="cmp-table"><tr><th class="rowlabel"></th>'+items.map(r=>`<th>${r.model}<div style="font-weight:400;color:var(--muted);font-size:12.5px">${LANG==='zh'?(r.brandZh||r.brand):r.brand}</div></th>`).join('')+'</tr>';
  h+='<tr><td class="rowlabel"></td>'+items.map(r=>`<td style="text-align:center"><a href="/detail.html?id=${r.id}"><span class="emoji">${EMOJI[r.category]}</span></a><div><button class="op del" style="color:var(--red);font-size:12.5px;font-weight:600;margin-top:6px" onclick="rm('${r.id}')">✕ ${LANG==='zh'?'移除':'Remove'}</button></div></td>`).join('')+'</tr>';
  rows.forEach(row=>{
    let best=-1;
    if(row.num){ best=bestIndex(items.map(r=>row.get(r)),row.num); }
    h+=`<tr><td class="rowlabel">${row.label}</td>`+items.map((r,i)=>{ let v=row.get(r); if(v==null||v==='')v='—'; return `<td class="${i===best?'cmp-best':''}">${v}${i===best?' ★':''}</td>`; }).join('')+'</tr>';
  });
  h+='</table></div>';
  root.innerHTML=h; applyI18n();
}
function rm(id){ toggleCmp(id); render(); }
async function init(){ renderChrome('compare'); await loadMeta(); applyI18n(); renderTray(); render(); document.addEventListener('langchange',render); }
init();
</script>
</body>
</html>
